<!DOCTYPE html><html><head><title>Mapa Interactivo de Barrios de Jesús María</title><meta charset="utf-8"><link rel="icon" href="https://raw.githubusercontent.com/modernizacionmjm/web/refs/heads/main/Logos/favicon.ico"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"><script src="https://unpkg.com/leaflet/dist/leaflet.js"></script><style>body{margin:0;padding:0;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;background-color:#f8f9fa}#mapa{height:100vh;width:100%;background-color:#fff}.leaflet-tooltip-own{background-color:rgba(0,0,0,.75);color:#fff;border:none;border-radius:4px;padding:8px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3)}</style></head><body><div id="mapa"></div><script>var mapa=L.map("mapa").setView([-31.07,-64.09],14);const osm=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(mapa),googleSatellite=L.tileLayer("https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",{maxZoom:20,subdomains:["mt0","mt1","mt2","mt3"],attribution:"&copy; Google"}),mapasBase={OpenStreetMap:osm,"Google Satellite":googleSatellite};L.control.layers(mapasBase,null,{position:"topright",collapsed:!1}).addTo(mapa);let h=Math.random();const golden_ratio_conjugate=.61803398875;function obtenerColorUnico(){h+=.61803398875,h%=1;return`hsl(${360*h}, 75%, 55%)`}function estiloBase(e){return e.properties.colorAsignado||(e.properties.colorAsignado=obtenerColorUnico()),{fillColor:e.properties.colorAsignado,fillOpacity:.75,weight:1.5,color:"white",opacity:1}}const estiloResaltado={weight:4,color:"#333",fillOpacity:.9};let geojsonLayer;function resaltarFeature(e){var o=e.target;o.setStyle(estiloResaltado),L.Browser.ie||L.Browser.opera||L.Browser.edge||o.bringToFront(),o.bindTooltip(o.feature.properties.nombre,{permanent:!1,direction:"center",className:"leaflet-tooltip-own"}).openTooltip()}function resetearResaltado(e){geojsonLayer.resetStyle(e.target),e.target.closeTooltip()}function hacerClickEnFeature(e){var o=e.target.feature.properties.nombre||"Nombre no disponible";L.popup().setLatLng(e.latlng).setContent('<h4 style="margin:0; padding:0;">Barrio:</h4><b style="font-size: 1.2em;">'+o+"</b>").openOn(mapa)}function onEachFeature(e,o){o.on({mouseover:resaltarFeature,mouseout:resetearResaltado,click:hacerClickEnFeature})}const geojsonURL="https://raw.githack.com/gisjesusmaria/web/main/barrios.geojson";fetch(geojsonURL).then(e=>{if(!e.ok)throw new Error(`Error al cargar los datos: ${e.statusText}`);return e.json()}).then(e=>{geojsonLayer=L.geoJson(e,{style:estiloBase,onEachFeature:onEachFeature}).addTo(mapa),geojsonLayer.getBounds().isValid()&&mapa.fitBounds(geojsonLayer.getBounds())}).catch(e=>{console.error("Hubo un error al cargar el GeoJSON:",e),alert("ERROR: No se pudo cargar la capa de barrios. Revisa la consola (F12) para más detalles.")})</script></body></html>
